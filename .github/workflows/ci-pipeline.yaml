name: CI Pipeline - Build & Update Manifests

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Backend Image
      run: |
        cd Application-Code/backend
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-backend:${{ github.run_number }} .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-backend:${{ github.run_number }}

    - name: Build and Push Frontend Image
      run: |
        cd Application-Code/frontend
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-frontend:${{ github.run_number }} .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-frontend:${{ github.run_number }}

    - name: Update Kubernetes Manifests Tag
      run: |
        sed -i 's|image: .*three-tier-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-backend:${{ github.run_number }}|g' Kubernetes-Manifests-Files/Backend/deployment.yaml
        sed -i 's|image: .*three-tier-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-frontend:${{ github.run_number }}|g' Kubernetes-Manifests-Files/Frontend/deployment.yaml

    - name: Commit & Push Updated Manifests
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Kubernetes-Manifests-Files/
        git commit -m "Auto-update image tags to build #${{ github.run_number }}" || exit 0
        git push